<div
  hlmCard
  class="bg-card border-border hover:border-muted-foreground rounded-lg border px-4 ring-0 transition-colors [--card-spacing:--spacing(3)]"
>
  <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between sm:gap-4">
    <div class="min-w-0">
      <p class="label-mono text-muted-foreground">Recurso</p>

      <h3
        class="mt-1 text-sm leading-snug font-semibold"
        [class.text-muted-foreground]="resource().isCompleted"
      >
        @if (resource().externalUrl; as url) {
          <!--
            Underlined at rest, like every text link in the app. The underline sits on
            the title alone, so it never runs under the gap before the icon
          -->
          <a
            [href]="url"
            target="_blank"
            rel="noopener noreferrer"
            class="group/link hover:text-highlight transition-colors"
          >
            <span
              class="decoration-muted-foreground/50 group-hover/link:decoration-highlight underline underline-offset-4 transition-colors"
              >{{ resource().title }}</span
            >
            <ng-icon
              name="lucideExternalLink"
              size="13px"
              class="text-muted-foreground group-hover/link:text-highlight ml-1.5 align-[-1px] transition-colors"
              aria-hidden="true"
            />
            <span class="sr-only">(se abre en otra pestaña)</span>
          </a>
        } @else {
          {{ resource().title }}
        }
      </h3>

      <!-- Where the link goes, so a video reads as a video before anyone opens it -->
      @if (resource().externalUrl; as url) {
        <p class="text-muted-foreground mt-1 truncate text-xs">{{ url | linkHost }}</p>
      }
    </div>

    <div class="flex shrink-0 items-center gap-1">
      <app-step-checkbox
        [checked]="resource().isCompleted"
        [busy]="busy()"
        [stepTitle]="resource().title"
        (toggled)="toggled.emit()"
      />

      <button
        hlmBtn
        variant="ghost"
        size="icon-sm"
        type="button"
        class="text-muted-foreground hover:text-destructive ml-2"
        [attr.aria-label]="'Eliminar el recurso ' + resource().title"
        [disabled]="deleting()"
        (click)="deleteRequested.emit()"
      >
        <ng-icon name="lucideTrash2" aria-hidden="true" />
      </button>
    </div>
  </div>
</div>
