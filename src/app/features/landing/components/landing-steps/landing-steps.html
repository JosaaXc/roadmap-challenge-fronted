<!-- How it works: three steps split by 1px vertical rules, with a light that follows the pointer -->
<section id="como-funciona" class="mx-auto w-full max-w-6xl px-4 sm:px-6">
  <div
    appSpotlight
    class="group/spotlight border-border relative flex flex-col border-y sm:flex-row"
  >
    <div
      aria-hidden="true"
      class="pointer-events-none absolute inset-0 bg-[radial-gradient(28rem_circle_at_var(--spot-x)_var(--spot-y),color-mix(in_oklch,var(--color-highlight)_14%,transparent),transparent_70%)] opacity-0 transition-opacity duration-500 group-hover/spotlight:opacity-100"
    ></div>

    @for (step of steps; track step.ordinal) {
      <div
        appReveal
        [revealDelay]="$index * 120"
        class="group/step relative flex-1 py-8 sm:px-8 sm:py-10 sm:first:pl-0 sm:last:pr-0"
      >
        <p
          class="label-mono text-muted-foreground group-hover/step:text-highlight transition-colors duration-300"
        >
          {{ step.ordinal }}
        </p>
        <h2 class="mt-4 text-lg font-semibold">{{ step.title }}</h2>
        <p class="text-muted-foreground mt-2 max-w-sm text-sm leading-relaxed">
          {{ step.description }}
        </p>
      </div>

      @if (!$last) {
        <hlm-separator orientation="vertical" decorative class="hidden sm:inline-flex" />
      }
    }
  </div>
</section>
