<!-- How it works: three steps split by 1px vertical rules -->
<section id="como-funciona" class="mx-auto w-full max-w-6xl px-4 sm:px-6">
  <div class="border-border flex flex-col border-y sm:flex-row">
    @for (step of steps; track step.ordinal) {
      <div class="flex-1 py-8 sm:px-8 sm:py-10 sm:first:pl-0 sm:last:pr-0">
        <p class="label-mono text-muted-foreground">{{ step.ordinal }}</p>
        <h2 class="mt-4 text-lg font-semibold">{{ step.title }}</h2>
        <p class="text-muted-foreground mt-2 max-w-sm text-sm leading-relaxed">
          {{ step.description }}
        </p>
      </div>

      @if (!$last) {
        <hlm-separator orientation="vertical" decorative class="hidden sm:inline-flex" />
      }
    }
  </div>
</section>
