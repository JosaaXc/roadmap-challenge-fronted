<hlm-field>
  <label hlmFieldLabel [for]="inputId">{{ label() }}</label>

  <hlm-input-group class="h-11">
    <!-- Edge adds its own reveal eye to password inputs; this field has one already -->
    <input
      hlmInputGroupInput
      class="h-full [&::-ms-reveal]:hidden"
      [id]="inputId"
      [type]="visible() ? 'text' : 'password'"
      [formControl]="control()"
      [attr.autocomplete]="isNew() ? 'new-password' : 'current-password'"
    />
    <hlm-input-group-addon align="inline-end">
      <button
        hlmInputGroupButton
        type="button"
        (click)="visible.set(!visible())"
        [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      >
        <ng-icon [name]="visible() ? 'lucideEyeOff' : 'lucideEye'" aria-hidden="true" />
      </button>
    </hlm-input-group-addon>
  </hlm-input-group>

  @if (isNew()) {
    <!-- The rule is strict, so it is stated up front instead of only after a failed attempt -->
    <p hlmFieldDescription>Mínimo 8 caracteres, con mayúscula, minúscula, número y símbolo.</p>
    <hlm-field-error validator="required">Escribe una contraseña nueva.</hlm-field-error>
    <hlm-field-error validator="minlength">Necesita al menos 8 caracteres.</hlm-field-error>
    <hlm-field-error validator="maxlength">No puede pasar de 128 caracteres.</hlm-field-error>
    <hlm-field-error validator="pattern">
      Le falta una mayúscula, una minúscula, un número o un símbolo.
    </hlm-field-error>
  } @else {
    <hlm-field-error validator="required">Escribe tu contraseña actual.</hlm-field-error>
  }
</hlm-field>
