<hlm-dialog (closed)="onClosed()">
  <hlm-dialog-content
    *hlmDialogPortal="let ctx"
    class="border-border rounded-lg border ring-0 sm:max-w-md"
  >
    <hlm-dialog-header>
      <h2 hlmDialogTitle>Cambiar contraseña</h2>
      <p hlmDialogDescription>
        Al cambiarla se cierran tus sesiones abiertas y vuelves a entrar con la nueva.
      </p>
    </hlm-dialog-header>

    <form [formGroup]="form" (ngSubmit)="submit(ctx)">
      <div hlmFieldGroup>
        <app-password-field [control]="form.controls.currentPassword" label="Contraseña actual" />
        <app-password-field [control]="form.controls.newPassword" label="Nueva contraseña" isNew />
      </div>

      @if (errorMessage(); as message) {
        <div hlmAlert variant="destructive" class="mt-5">{{ message }}</div>
      }

      <hlm-dialog-footer class="mt-6">
        <button hlmBtn variant="ghost" type="button" hlmDialogClose>Cancelar</button>
        <button hlmBtn type="submit" class="gap-2" [disabled]="isSaving()">
          @if (isSaving()) {
            <hlm-spinner class="text-base" />
          }
          Cambiar contraseña
        </button>
      </hlm-dialog-footer>
    </form>
  </hlm-dialog-content>
</hlm-dialog>
