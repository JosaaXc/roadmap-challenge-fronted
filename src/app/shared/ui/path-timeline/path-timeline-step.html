@if (!last()) {
  <!-- Rail to the next step: grey underneath, cyan drawn over it once travelled -->
  <span aria-hidden="true" class="bg-border absolute top-4 -bottom-7 left-[11px] w-px"></span>

  <!--
    Always rendered and scaled from the top, so completing a step draws the rail
    down to the next marker and undoing it pulls the rail back
  -->
  <span
    aria-hidden="true"
    class="bg-highlight absolute top-4 -bottom-7 left-[11px] w-px origin-top transition-transform duration-500 ease-out motion-reduce:transition-none"
    [class.scale-y-0]="state() !== 'completed' || !revealed()"
    [style.transition-delay.ms]="revealDelay()"
  ></span>
}

<!-- Markers are positioned so they paint over the rail of the step above -->
@switch (state()) {
  @case ('completed') {
    <span
      class="bg-highlight text-background relative mt-4 flex size-5.5 shrink-0 items-center justify-center rounded-full"
    >
      <ng-icon name="lucideCheck" size="14px" aria-hidden="true" />
    </span>
  }
  @case ('current') {
    <span
      class="text-highlight bg-background relative mt-4 flex size-5.5 shrink-0 items-center justify-center rounded-full"
    >
      <ng-icon name="lucideCircleDot" size="22px" aria-hidden="true" />
    </span>
  }
  @case ('pending') {
    <span
      class="border-border text-muted-foreground bg-background relative mt-4 flex size-5.5 shrink-0 items-center justify-center rounded-full border"
    >
      @if (lockPending()) {
        <ng-icon name="lucideLock" size="11px" aria-hidden="true" />
      }
    </span>
  }
}

<div class="min-w-0 flex-1">
  <ng-content />
</div>
