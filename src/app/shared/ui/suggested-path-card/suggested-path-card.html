<div
  hlmCard
  class="border-border rounded-lg border ring-0"
  [class]="compact() ? '[--card-spacing:--spacing(3.5)]' : '[--card-spacing:--spacing(5)]'"
>
  <div hlmCardHeader class="flex flex-row items-center justify-between gap-3">
    <p class="label-mono text-muted-foreground">{{ headerLabel() }}</p>
    <p class="label-mono text-highlight whitespace-nowrap">{{ progressLabel() }}</p>
  </div>

  <div hlmCardContent>
    <ol class="relative flex flex-col" [class]="compact() ? 'gap-2' : 'gap-3'">
      @for (course of courses(); track course.title) {
        <li
          appPathTimelineStep
          [state]="timelineState[course.status]"
          [last]="$last"
          [revealed]="pathRevealed()"
          [revealDelay]="$index * 260"
          lockPending
        >
          <div
            hlmCard
            class="bg-card-raised border-border rounded-lg border ring-0"
            [class]="
              compact() ? '[--card-spacing:--spacing(3)]' : '[--card-spacing:--spacing(3.5)]'
            "
          >
            <div hlmCardContent>
              <p
                class="label-mono"
                [class.text-highlight]="course.status === 'next'"
                [class.text-muted-foreground]="course.status !== 'next'"
              >
                {{ statusLabel[course.status] }}
              </p>

              <p hlmCardTitle class="mt-1.5 text-sm">{{ course.title }}</p>

              @if (course.unlockAfter && !compact()) {
                <p class="text-muted-foreground mt-1.5 text-xs">
                  Se abre cuando termines {{ course.unlockAfter }}
                </p>
              }
            </div>
          </div>
        </li>
      }
    </ol>
  </div>
</div>
