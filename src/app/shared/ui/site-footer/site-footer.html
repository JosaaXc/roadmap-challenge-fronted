    <div class="flex flex-col gap-6 sm:flex-row sm:items-center sm:justify-between">
      <a [routerLink]="homeLink()" [attr.aria-label]="homeLabel()" class="w-fit">
        <app-brand-logo />
      </a>

      <!-- The page's own links, if it has any -->
      <ng-content />
    </div>

    <p class="text-muted-foreground mt-6 text-xs leading-relaxed">
      © {{ currentYear }} DevTalles. Las rutas se generan con el catálogo público de la academia y
      sus prerequisitos.
    </p>
