<div class="bg-background text-foreground relative isolate min-h-screen">
  <!-- Each page lights it with its own covers, so the violet is never the only colour -->
  <app-page-light />

  <app-glass-header homeLink="/mis-rutas" homeLabel="CodeQuest, ir a mis rutas">
    <nav class="text-muted-foreground flex items-center gap-4">
      @if (sessionStore.isAdmin()) {
        <a
          routerLink="/admin"
          routerLinkActive="text-foreground"
          class="hover:text-foreground px-2 py-2 text-xs font-semibold tracking-widest uppercase transition-colors"
        >
          Panel Administrador
        </a>
      }
      <app-user-avatar-menu />
    </nav>
  </app-glass-header>

  <main class="mx-auto w-full max-w-6xl px-6 py-8">
    <router-outlet />
  </main>
</div>
